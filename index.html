<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://telegram.org https://cdnjs.cloudflare.com; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://t.me https://*.telegram.org https://*.telesco.pe https://*.telegram-cdn.org; connect-src https://www.cbr-xml-daily.ru; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#121514">
<title>До зарплаты</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:light;padding-top:var(--sat,env(safe-area-inset-top,0px));padding-bottom:var(--sab,env(safe-area-inset-bottom,0px))}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first app shell — sticky top bar, one screen at a time, bottom tab bar on phones, top tabs on desktop.
   Debt progress is a 100-cell ledger grid: every cell is 1% of the debt, filled as it gets paid. */
:root{
  --bg:#f3f4f2; --surface:#ffffff; --sunk:#eceeeb; --line:#dfe2de; --ink:#161a18; --muted:#636b66;
  --accent:#2f6b4f; --accent-soft:#e3eee8; --accent-mid:#8fbba5; --warn:#a8670f; --warn-soft:#f6ecd9; --bad:#b42318; --bad-soft:#f8e3e0;
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --f-disp:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --tabbar:64px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121514; --surface:#1a1e1c; --sunk:#151917; --line:#2b312e; --ink:#e7ebe8; --muted:#97a19b;
  --accent:#6fb895; --accent-soft:#1f3129; --accent-mid:#3d6b55; --warn:#e0a54a; --warn-soft:#352a16; --bad:#f07a6c; --bad-soft:#3a1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121514; --surface:#1a1e1c; --sunk:#151917; --line:#2b312e; --ink:#e7ebe8; --muted:#97a19b;
  --accent:#6fb895; --accent-soft:#1f3129; --accent-mid:#3d6b55; --warn:#e0a54a; --warn-soft:#352a16; --bad:#f07a6c; --bad-soft:#3a1f1c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--tabbar) + 32px + var(--sab))}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--sat);z-index:10;background:var(--bg)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:22px;letter-spacing:-.01em}
h2{font-size:15px;display:flex;align-items:center;gap:8px}
p{margin:0}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .neg{color:var(--bad)} .pos{color:var(--accent)}
.note{font-size:13px;color:var(--muted)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.top{position:sticky;top:var(--sat);z-index:5;background:var(--bg);max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;white-space:nowrap}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.brand .mark svg{width:17px;height:17px}
.tabs{display:flex;gap:2px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:7px}
.tabs button[aria-current=page]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.topright{display:flex;align-items:center;gap:8px}
.balchip{border-radius:999px;padding:5px 12px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px;gap:6px}
.balchip svg{width:16px;height:16px;color:var(--muted)}
.balchip.neg{color:var(--bad)}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px}
.ava{width:26px;height:26px;border-radius:50%;overflow:hidden;flex:none;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--f-mono);font-weight:600;font-size:13px;line-height:1}
.ava.big{width:52px;height:52px;font-size:22px}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.ava:empty::before{content:"";width:40%;height:40%;border-radius:50%;background:var(--accent-mid)}
#meName,#whoName,#whoSub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;unicode-bidi:isolate}
#meName{max-width:120px}
#whoName{display:block}
.f.full{grid-column:1/-1}
select{-webkit-appearance:none;appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;cursor:pointer}
.unit select{padding-right:22px;background-position:calc(100% - 9px) 50%,calc(100% - 4px) 50%}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + var(--sab)) max(8px,env(safe-area-inset-left,0px));
  grid-template-columns:repeat(5,1fr)}
.tabbar button{border:0;background:transparent;color:var(--muted);flex-direction:column;gap:2px;font-size:11px;padding:6px 0;justify-content:center}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current=page]{color:var(--ink)}
.tabbar button[aria-current=page] svg{stroke-width:2.1}
main{max-width:1040px;margin:0 auto}
.view{display:none;flex-direction:column;gap:16px}
.view.on{display:flex}
.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-top:4px}
.cols{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.link{cursor:pointer}
.card.link:hover{border-color:var(--muted)}
.hero .big{font-size:clamp(52px,13vw,84px);line-height:.95;letter-spacing:-.04em;font-weight:500}
.hero .big small{font-size:.34em;color:var(--muted);margin-left:6px;letter-spacing:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill svg{width:14px;height:14px}
.segbar{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.segbar i{height:10px;border-radius:3px;background:var(--sunk)}
.segbar i.on{background:var(--accent)}
.segbar.warn i.on{background:var(--warn)} .segbar.bad i.on{background:var(--bad)}
.segbar i.part{background:linear-gradient(90deg,var(--accent) var(--p),var(--sunk) var(--p))}
.segbar.warn i.part{background:linear-gradient(90deg,var(--warn) var(--p),var(--sunk) var(--p))}
.kv{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
.row:last-child{border-bottom:0}
.row.total{font-weight:600;border-top:1px solid var(--ink);border-bottom:0;padding-top:10px}
.linkbtn{border:0;background:none;padding:0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stats>div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stats .v{font-size:17px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stats .s{font-size:12px;color:var(--muted)}
.stats .linkbtn{font-size:12px;white-space:normal;text-align:left;align-self:flex-start;line-height:1.3}
.editbal{display:flex;gap:6px}
.editbal input{padding:5px 8px;font-size:15px}
.editbal button{padding:5px 8px}
.pen{border:0;background:transparent;padding:2px;color:var(--muted)}
.pen svg{width:15px;height:15px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--sunk);font-size:14px}
.banner.ok{background:var(--accent-soft)} .banner.bad{background:var(--bad-soft)}
.banner svg{margin-top:2px}
.banner.ok svg{color:var(--accent)} .banner.bad svg{color:var(--bad)}
.streak{display:flex;align-items:center;gap:10px}
.streak .flames{display:flex;gap:3px}
.streak .flames i{width:8px;height:18px;border-radius:2px;background:var(--line)}
.streak .flames i.on{background:var(--accent)}

/* plan picker */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);white-space:normal}
.opt .rd{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.opt[aria-checked=true]{border-color:var(--ink);background:var(--sunk)}
.opt[aria-checked=true] .rd{border-color:var(--ink);background:var(--ink)}
.opt[aria-checked=true] .rd::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--bg)}
.opt b{font-weight:600;display:block}
.opt .sub{font-size:13px;color:var(--muted)}
.opt .amt{text-align:right;font-size:17px}
.opt .amt small{display:block;font-size:11px;color:var(--muted);font-family:var(--f-sans)}

/* spend entry */
.amount{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:6px 14px}
.amount input{border:0;background:transparent;font-size:28px;padding:4px 0;font-family:var(--f-mono)}
.amount input:focus-visible{outline:0}
.amount:focus-within{border-color:var(--ink)}
.amount span{font-size:22px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;padding:6px 14px;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.quick button{flex:none;flex-direction:column;align-items:flex-start;gap:0;padding:8px 12px;border-radius:12px;background:var(--sunk);border-color:transparent}
.quick button b{font-weight:500;font-size:13px}
.quick button span{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.quick button:hover{border-color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.limitline{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.limitline .catbar{flex:1}

.tl{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:56px 1fr auto;gap:10px;padding:9px 0;align-items:center;border-bottom:1px dashed var(--line)}
.ev:last-child{border-bottom:0}
.ev .d{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.ev .what{min-width:0}
.ev .what small{display:block;font-size:12px;color:var(--muted)}
.ev .what .num{display:block;white-space:nowrap;font-size:13px;margin-top:2px}
.ev.pay .what{color:var(--accent);font-weight:500}
.tag{font-size:11px;color:var(--muted);margin-left:6px}

.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{min-width:0}
.li .t small{display:block;font-size:12px;color:var(--muted)}
.li.click .t{cursor:pointer}
.li.edit{grid-template-columns:1fr;gap:8px}
.li.edit .two{grid-template-columns:repeat(4,minmax(0,1fr))}
.li.edit .acts{display:flex;gap:8px;justify-content:flex-end}

/* editable rows */
.erow{display:grid;grid-template-columns:minmax(0,1fr) 120px 92px auto 32px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:0}
.erow.h{grid-template-columns:minmax(0,1fr) 120px 150px 32px}
.erow.q{grid-template-columns:minmax(0,1fr) 110px 130px 32px}
.erow.c{grid-template-columns:minmax(0,1fr) 150px 32px}
.unit{display:flex;align-items:center;gap:4px;border:1px solid transparent;border-radius:8px;padding:0 8px;background:var(--sunk);min-width:0}
.unit:focus-within{border-color:var(--ink)}
.unit input,.unit select{border:0;background:transparent;padding:7px 0;text-align:right;min-width:0}
.unit select{text-align:left}
.unit input:focus-visible,.unit select:focus-visible{outline:0}
.unit span{font-size:12px;color:var(--muted);white-space:nowrap}
.unit.date input{text-align:left}
.unit.need,input.need{box-shadow:inset 0 0 0 1.5px var(--warn)}
.plain{border:1px solid transparent;background:transparent;padding:7px 8px;font-weight:500}
.plain:hover{border-color:var(--line)} .plain:focus{border-color:var(--ink);background:var(--sunk)}
.toggle{font-size:12px;padding:5px 10px;border-radius:999px}
.toggle[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* debt ledger grid */
.ledger{display:grid;grid-template-columns:repeat(20,1fr);gap:4px}
.ledger i{aspect-ratio:1;border-radius:3px;background:var(--sunk);max-width:100%}
.ledger i.paid{background:var(--accent)}
.ledger i.pot{background:repeating-linear-gradient(135deg,var(--accent) 0 2px,var(--accent-soft) 2px 5px);box-shadow:inset 0 0 0 1px var(--accent)}
.ledger i.next{box-shadow:inset 0 0 0 1.5px var(--ink)}
.ledger i.mile{position:relative}
.ledger i.mile::after{content:"";position:absolute;right:-3px;top:15%;bottom:15%;width:2px;border-radius:1px;background:var(--muted)}
.ledger.mini{grid-template-columns:repeat(25,1fr);gap:3px}
.ledger.mini i{border-radius:2px}
@media (prefers-reduced-motion:no-preference){
  .ledger i.fresh{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--k) * 35ms)}
  @keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:2px;display:inline-block;background:var(--sunk)}
.legend i.paid{background:var(--accent)}
.legend i.pot{background:repeating-linear-gradient(135deg,var(--accent) 0 2px,var(--accent-soft) 2px 5px);box-shadow:inset 0 0 0 1px var(--accent)}
.pct{font-size:clamp(48px,11vw,72px);line-height:.95;letter-spacing:-.04em;font-weight:500}
.pct small{font-size:.32em;letter-spacing:0;color:var(--muted);margin-left:6px}
.miles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mile-b{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;border:1px dashed var(--line);text-align:center;font-size:12px;color:var(--muted)}
.mile-b svg{width:22px;height:22px}
.mile-b b{font-size:15px;color:var(--ink);font-family:var(--f-mono)}
.mile-b.done{border-style:solid;border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.mile-b.done b{color:var(--accent)}
.mile-b.next{border-color:var(--ink);border-style:solid}
.debt-head{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.debt-head>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.debt-head .v{font-size:20px}
.dcard{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.dcard:last-child{border-bottom:0}
.dcard .fgrid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
input[type=range]{padding:0;background:transparent;border:0;accent-color:var(--accent);height:28px}
.whatif{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;background:var(--sunk)}

svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.row.cat{display:grid;grid-template-columns:minmax(0,1fr) minmax(60px,1fr) auto;align-items:center}
.catbar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;display:block}
.catbar>i{display:block;height:100%;background:var(--accent)}
.catbar.over>i{background:var(--bad)} .catbar.near>i{background:var(--warn)}
.dayhead{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:10px}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 16px;align-items:baseline}
.cmp .h{font-size:12px;color:var(--muted)}
.cmp .d{font-size:12px}

form{margin:0}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .f>span{flex:1}
.fgrid input{height:42.5px}
.dcard .opt.io{margin-top:10px;width:100%}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>span{font-size:12px;color:var(--muted)}
input,select{font:inherit;font-size:15px;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0;width:100%}
input[type=number]{font-family:var(--f-mono)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
input:focus-visible,select:focus-visible,button:focus-visible,.btnlike:focus-within{outline:2px solid var(--accent);outline-offset:1px}
button,.btnlike{font:inherit;font-size:14px;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
button:hover,.btnlike:hover{border-color:var(--muted)}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.block{width:100%;padding:12px}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px}
button.ghost:hover{color:var(--bad)}
button.ok{color:var(--accent);padding:6px 10px;font-size:13px}
button.danger{color:var(--bad)}
button.danger.armed{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunk)}
.seg button{border:0;border-radius:0;padding:8px 14px;background:transparent;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.split>div{background:var(--sunk);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.split .s{font-size:12px;color:var(--muted)}
.split .v{font-size:16px}
.calcline{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:14px}
.catedit{display:flex;flex-direction:column}
.csvbox{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:0 10px}
.csvrow{display:grid;grid-template-columns:auto 70px minmax(0,1fr) 90px 120px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.csvrow:last-child{border-bottom:0}
.csvrow .desc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csvrow select{padding:4px 6px;font-size:13px}

/* profile */
.who{display:flex;align-items:center;gap:14px}
.who img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--sunk)}
.status{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--sunk);font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);margin-top:7px;flex:none}
.dot.ok{background:var(--accent)} .dot.err{background:var(--bad)} .dot.warn{background:var(--warn)}

/* onboarding */
.onb{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:12px}
.steps{display:flex;gap:6px}
.steps i{height:4px;flex:1;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--ink)}
.onb .nav{display:flex;gap:8px;justify-content:space-between}
.presets{display:flex;flex-wrap:wrap;gap:6px}
body.onboarding .tabbar,body.onboarding .tabs,body.onboarding .topright{display:none!important}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + 20px + var(--sab));z-index:7;background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);display:flex;align-items:center;gap:10px}
.toast:not(:has(button)){padding-right:16px}
.toast button{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent);border-radius:999px;padding:4px 12px;font-size:13px}

@media (max-width:760px){
  .tabs{display:none}
  .tabbar{display:grid}
  .cols{grid-template-columns:1fr}
  .me span,.brand .bt{display:none}
  .me{padding:3px}
  .erow{grid-template-columns:1fr 1fr auto 32px;row-gap:4px}
  .erow .plain{grid-column:1/-1}
  .erow.h,.erow.q{grid-template-columns:1fr 1fr 32px}
  .erow.c{grid-template-columns:1fr 1fr 32px}
  .erow.c .plain{grid-column:auto}
  .debt-head .v{font-size:17px}
  .li.edit .two{grid-template-columns:1fr 1fr}
  .csvrow{grid-template-columns:auto 60px minmax(0,1fr) 80px;}
  .csvrow select{grid-column:2/-1}
  .ledger{gap:3px}
}
@media (min-width:761px){ body{padding-bottom:48px} .toast{bottom:28px} }

/* ---------- sizes ----------
   Phones (<=760): one column, tab bar at the bottom.
   Tablets and narrow windows (761-1099): one centred column, tabs on top.
   Wide screens (>=1100): two columns.
   Inside a card the layout follows the card's own width, so it looks the same on a phone and in a column. */
@media (min-width:761px) and (max-width:1099px){ main,.top{max-width:720px} .cols{grid-template-columns:1fr} }
.card{container-type:inline-size}
.chip{max-width:100%;overflow:hidden;text-overflow:ellipsis}
/* list rows: the name gets its own line in every size, the fields share the next one */
.erow{grid-template-columns:minmax(0,1fr) minmax(124px,1fr) auto 32px;row-gap:4px}
.erow .plain{grid-column:1/-1}
.erow.h,.erow.q,.erow.c{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 32px}
.erow.c .plain{grid-column:auto}
.erow.h{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr) 32px}
.dcard .fgrid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.li.edit .two{grid-template-columns:1fr 1fr}
@container (max-width:300px){ .erow.h{grid-template-columns:minmax(0,1fr) 32px} .erow.h>.unit{grid-column:1} }
@container (max-width:520px){
  .debt-head{grid-template-columns:1fr 1fr}
  .debt-head>div:last-child{grid-column:1/-1}
  .csvrow{grid-template-columns:auto 60px minmax(0,1fr) 80px}
  .csvrow select{grid-column:2/-1}
}
@container (max-width:440px){
  .stats{grid-template-columns:1fr}
  .stats>div{flex-direction:row;flex-wrap:wrap;align-items:baseline;justify-content:space-between;column-gap:12px}
  .stats .linkbtn{flex-basis:100%;justify-content:flex-start;padding:0}
  .miles{grid-template-columns:1fr 1fr}
}
@container (max-width:360px){
  .ev{grid-template-columns:48px minmax(0,1fr);row-gap:6px;align-items:start}
  .ev .d{padding-top:2px}
  .ev>button{grid-column:2;justify-self:start;padding:6px 12px;font-size:13px}
}
@container (max-width:300px){ .two{grid-template-columns:1fr} }

  @keyframes celeIn{0%{transform:scale(.85) translateY(16px);opacity:0}100%{transform:none;opacity:1}}
  .confetti i{animation:fall var(--t) linear var(--d) both}

}

.chartwrap{display:flex;flex-direction:column;gap:8px}
.chread{display:flex;gap:8px;align-items:center;min-height:38px;padding:8px 12px;border-radius:10px;background:var(--sunk);font-size:13px;color:var(--muted)}

input.slider{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;border:0;padding:0;cursor:pointer}
input.slider::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--line) var(--p,0%))}
input.slider::-moz-range-track{height:10px;border-radius:5px;background:var(--line)}
input.slider::-moz-range-progress{height:10px;border-radius:5px;background:var(--accent)}
input.slider::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-9px;border-radius:9px;background:var(--ink);border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--ink);cursor:grab}
input.slider::-moz-range-thumb{width:22px;height:22px;border-radius:9px;background:var(--ink);border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--ink);cursor:grab}
input.slider:active::-webkit-slider-thumb{cursor:grabbing;transform:scale(1.08)}
.ticks{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:-6px;padding:0 4px}
@media (prefers-reduced-motion:no-preference){.opt,.chip{transition:background .15s,border-color .15s}}

<script>
const DEFAULT = {
  v: 2, onboarded: false, balance: 0, usdRate: 80, eurRate: 90, ratesAt: '', ratesAuto: false, cele: null, paydays: [], skip: 0,
  planMonthly: 0, potUsed: 0, reserve: 0, debtStart: 0,
  cats: ['Еда', 'Транспорт', 'Другое'], catLimits: {}, quick: [],
  debts: [], goals: [], bills: [], habits: [], oneoffs: [], entries: [], spends: [], limits: {},
  payMode: 'days', payWeekday: 5, payAnchor: '', payNext: '', scen: null
};
let goalTab = 'debt';
const clone = o => JSON.parse(JSON.stringify(o));
let S = clone(DEFAULT);
let view = 'home', mode = 'loading';
let me = { name: '', avatarUrl: '', handle: '' };
// Names and photos come from outside (Telegram profile), so they are treated as hostile input:
// the name is cleaned and only ever written with textContent; the photo must be an https image
// from Telegram's own hosts (or a same-origin / data image) and is set as a property, never as markup.
function cleanName(v, max = 40) {
  let t = String(v ?? '');
  try { t = t.normalize('NFC'); } catch (e) {}
  t = t.replace(/[\u0000-\u001F\u007F-\u009F\u200B\u200E\u200F\u202A-\u202E\u2060-\u2069\uFEFF]/g, '').replace(/\s+/g, ' ').trim();
  return Array.from(t).slice(0, max).join('');
}
function safeImg(u) {
  try {
    u = String(u || ''); if (!u || u.length > 200000) return '';
    if (/^data:image\/(png|jpeg|webp|gif|svg\+xml)[;,]/i.test(u)) return u;
    const x = new URL(u, location.href);
    if (x.origin === location.origin && x.protocol !== 'file:') return x.href;
    if (x.protocol === 'https:' && !x.username && !x.password && /(^|\.)(t\.me|telegram\.org|telesco\.pe|telegram-cdn\.org)$/i.test(x.hostname)) return x.href;
  } catch (e) {}
  return '';
}
function paintAva(el) {
  if (!el) return;
  const initial = () => { el.textContent = (Array.from(me.name || '')[0] || '').toUpperCase(); el.classList.add('letter'); };
  el.textContent = ''; el.classList.remove('letter');
  const url = safeImg(me.avatarUrl);
  if (!url) { initial(); return; }
  const img = document.createElement('img');
  img.alt = ''; img.referrerPolicy = 'no-referrer'; img.decoding = 'async'; img.draggable = false;
  img.onerror = initial; img.src = url;
  el.appendChild(img);
}
let ownCat = false, moreCats = false;
let spendCat = '', incCur = 'USD', incKind = 'salary', moneyTab = 'spends';
let editBal = false, editSpend = null, whatIf = 0, csvRows = null, csvDeduct = false;
let onb = null, onbStep = 0;
let shownCells = null;   // cells already drawn this visit, so only new ones animate
const KINDS = { salary: 'Зарплата', gift: 'Подарили', returned: 'Вернули долг', side: 'Подработка', other: 'Другое' };
const isSalary = e => !e.kind || e.kind === 'salary';

/* ---------- utils ---------- */
const $ = id => document.getElementById(id);
const ic = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rub = n => { const v = Math.round(+n || 0); return (v < 0 ? '−' : '') + Math.abs(v).toLocaleString('ru-RU') + '\u00A0₽'; };
const sgn = n => (n > 0 ? '+' : '') + rub(n);
const uid = () => Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const ym = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const parse = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, m-1, d); };
const today0 = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const diffDays = (a, b) => Math.round((b - a) / 864e5);
const dim = (y, m) => new Date(y, m+1, 0).getDate();
const MON = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MONTHS_IN = ['январе','феврале','марте','апреле','мае','июне','июле','августе','сентябре','октябре','ноябре','декабре'];
const fmtD = d => `${d.getDate()} ${MON[d.getMonth()]}`;
const CUR = { RUB: '₽', USD: '$', EUR: '€' };
const rateOf = c => c === 'USD' ? +S.usdRate || 0 : c === 'EUR' ? +S.eurRate || 0 : 1;
const toRub = (v, cur, rate) => (+v || 0) * (cur === 'USD' || cur === 'EUR' ? (+rate || rateOf(cur)) : 1);
const money = (v, cur) => cur === 'USD' || cur === 'EUR' ? CUR[cur] + (+v || 0).toLocaleString('ru-RU') : rub(v);
function plural(n, a, b, c) { n = Math.abs(n) % 100; const n1 = n % 10; if (n > 10 && n < 20) return c; if (n1 > 1 && n1 < 5) return b; if (n1 === 1) return a; return c; }
const daysW = n => `${n} ${plural(n,'день','дня','дней')}`;
const monW = n => `${n} ${plural(n,'месяц','месяца','месяцев')}`;
const monthName = (t, add) => { const d = new Date(t.getFullYear(), t.getMonth() + add, 1); return `${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
let toastT;
function toast(t, action) {

const TABS = [['home','Сегодня','home'],['money','Деньги','in'],['bills','Платежи','list'],['debt','Цели','flag'],['profile','Кабинет','user']];
function renderNav() {

  $('meBtn').toggleAttribute('aria-current', view === 'profile');

function go(v) {
  if (v === 'income') v = 'money';

  view = v; if (location.hash.slice(1) !== v) history.replaceState(null, '', '#' + v);
  renderNav(); window.scrollTo(0, 0);
}
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== view) { view = TABS.some(t => t[0] === h) ? h : 'home'; renderNav(); } });

/* ---------- views ---------- */
function render() {
  if (S.onboarded && !onb && !S.cele && mode !== 'loading') S.cele = celeLevels();

function renderSpends() {
  const c = calc(), t = c.t, N = 14;
  const days = [...Array(N)].map((_, i) => addDays(t, i - N + 1));
  const vals = days.map(d => freeSpends(ymd(d), c.hs));
  const limOf = d => S.limits[ymd(d)] ?? Math.max(0, c.perDay);
  const max = Math.max(...days.map(limOf), ...vals, 1);
  const W = 480, H = 150, pb = 20, pt = 8, bw = (W / N) * 0.62;
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  const bars = days.map((d, i) => {
    const v = vals[i], l = limOf(d), x = (W / N) * i + (W / N - bw) / 2;
    return `<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, (H - pb) - y(v)).toFixed(1)}" rx="3" fill="${v ? (v > l ? 'var(--bad)' : 'var(--accent)') : 'var(--line)'}"><title>${fmtD(d)}: ${rub(v)} при лимите ${rub(l)}</title></rect>
      <line x1="${(x - 2).toFixed(1)}" x2="${(x + bw + 2).toFixed(1)}" y1="${y(l).toFixed(1)}" y2="${y(l).toFixed(1)}" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round"/>` +
      (i % 2 === (N - 1) % 2 ? `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 5}" text-anchor="middle">${d.getDate()}</text>` : '');
  }).join('');
  const ps = periodStart(t), psKey = ymd(ps);
  const periodSp = S.spends.filter(s => s.date >= psKey && !s.planned);
  const catSum = {}; let periodTotal = 0;
  for (const s of periodSp) { catSum[s.cat] = (catSum[s.cat] || 0) + (+s.amount || 0); periodTotal += +s.amount || 0; }
  for (const k of Object.keys(S.catLimits)) if (+S.catLimits[k] > 0 && !(k in catSum)) catSum[k] = 0;
  const catRows = Object.entries(catSum).sort((a, b) => b[1] - a[1]);
  const daysIn = Math.max(1, diffDays(ps, t) + 1);
  const groups = {};
  for (const s of [...S.spends].sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 150)) (groups[s.date] = groups[s.date] || []).push(s);
  $('mBody').innerHTML = `
  <div class="cols">
    <div class="stack">
      <div class="card">
        <div class="kv"><h2>${ic('out')}Последние 2 недели</h2><span class="note">черта — лимит дня</span></div>
        <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Траты по дням за две недели">${bars}</svg>
        <p class="note">Без регулярных мелочей и обязательных платежей. Красным отмечены дни с перерасходом.</p>
      </div>
      <div class="card">
        <div class="kv"><h2>С ${fmtD(ps)}</h2><span class="num">${rub(periodTotal)}</span></div>
        <p class="note">В среднем ${rub(periodTotal / daysIn)} в день за ${daysW(daysIn)}</p>
        ${catRows.length ? `<div class="rows">${catRows.map(([k, v]) => { const L = +S.catLimits[k] || 0, base = L || periodTotal || 1;
          return `<div class="row cat"><span>${esc(k)}${L ? `<span class="tag">лимит ${rub(L)}</span>` : ''}</span><span class="catbar ${L && v > L ? 'over' : L && v > L * .8 ? 'near' : ''}"><i style="width:${Math.min(100, v / base * 100).toFixed(1)}%"></i></span><span class="num ${L && v > L ? 'neg' : ''}">${rub(v)}</span></div>`; }).join('')}</div>`
          : '<p class="empty">С зарплаты трат пока нет.</p>'}
      </div>
    </div>
    <div class="card">
      <h2>Все траты</h2>
      <p class="note">Нажми на трату, чтобы изменить сумму, категорию или дату.</p>
      ${Object.keys(groups).length ? Object.entries(groups).map(([d, arr]) => `
        <div class="dayhead"><span>${fmtD(parse(d))}</span><span class="num">${rub(arr.reduce((a, s) => a + (+s.amount || 0), 0))}</span></div>
        <div class="list">${arr.map(s => spendRow(s, true)).join('')}</div>`).join('')
        : '<p class="empty">Записывай траты на экране «Сегодня», здесь появится история.</p>'}
    </div>
  </div>`;
}

  if (t.id === 'whatIfNum') { whatIf = Math.max(0, Math.min(1e7, Math.round(+t.value || 0))); const y = scrollY; renderDebt(); scrollTo(0, y); return; }
  if (t.id === 'whatIf') { const y = scrollY; renderDebt(); scrollTo(0, y); const r = $('whatIf'); if (r) r.focus(); return; }
  if (t.dataset.date) {
    const dd = t.value ? parse(t.value) : null, dayv = dd && !isNaN(dd) ? dd.getDate() : 0;
    const list = t.dataset.bill ? T.bills : t.dataset.debt ? T.debts : null, x = list && list.find(b => b.id === (t.dataset.bill || t.dataset.debt));
    if (x) { x.day = dayv; if (onb) render(); else commit(dayv ? `Платёж каждое ${dayv}-е число` : undefined); }
    return;
  }
  const num = isFinite(+t.value) ? +t.value : 0;
  const val = t.type === 'number' ? (t.dataset.set === 'balance' ? num : Math.min(1e12, Math.max(0, num))) : String(t.value).slice(0, 60);
  if (t.dataset.bill) { const x = T.bills.find(b => b.id === t.dataset.bill); if (x) { x[t.dataset.f] = t.dataset.f === 'day' ? Math.min(31, Math.max(1, Math.round(val) || 1)) : val; if (!onb) commit(); } }
  if (t.dataset.debt) {
    const x = T.debts.find(b => b.id === t.dataset.debt);
    if (x) {
      const f = t.dataset.f, v = f === 'day' ? Math.min(31, Math.max(1, Math.round(val) || 1)) : val;
      if (!onb && f === 'balance' && v > (+x.balance || 0)) S.debtStart = (+S.debtStart || 0) + (v - (+x.balance || 0));
      x[f] = v; if (!onb) commit();
    }
  }
  if (t.dataset.goal) { const x = T.goals.find(b => b.id === t.dataset.goal); if (x) { x[t.dataset.f] = t.dataset.f === 'name' ? (String(val).trim() || 'Цель') : val; if (!onb) commit(); } }
  if (t.dataset.pay) {
    const k = t.dataset.pay; if (onb) readOnb();
    if (k === 'paydays' && !parsePaydays(t.value).length) { toast('Укажи хотя бы одно число месяца, например 1 или 10, 25'); t.value = (T.paydays || []).join(', '); return; }
    T[k] = k === 'paydays' ? parsePaydays(t.value) : k === 'payWeekday' ? +t.value : t.value;
    if (T.payMode === 'manual') T.skip = 0;
    if (onb) render(); else commit('Сохранено');
  }
  if (t.dataset.habit) { const x = S.habits.find(b => b.id === t.dataset.habit); if (x) { x[t.dataset.f] = val; commit(); } }
  if (t.dataset.one) { const x = S.oneoffs.find(b => b.id === t.dataset.one); if (x) { x[t.dataset.f] = val; commit(); } }
  if (t.dataset.q) { const x = S.quick.find(b => b.id === t.dataset.q); if (x) { x[t.dataset.f] = val; commit(); } }
  if (t.dataset.catlim !== undefined) { const v = +t.value || 0; if (v > 0) S.catLimits[t.dataset.catlim] = v; else delete S.catLimits[t.dataset.catlim]; commit('Лимит сохранён'); }
  if (t.dataset.set === 'usdRate' || t.dataset.set === 'eurRate') { S.ratesAt = ymd(today0()); S.ratesAuto = false; }
  if (t.dataset.set) { S[t.dataset.set] = t.dataset.set === 'paydays' ? parsePaydays(t.value) : val; commit('Сохранено'); }
  if (t.dataset.csvOn) { const r = csvRows.find(x => x.id === t.dataset.csvOn); if (r) { r.on = t.checked; renderProfile(); } }
  if (t.dataset.csvCat) { const r = csvRows.find(x => x.id === t.dataset.csvCat); if (r) r.cat = t.value; }
  if (t.id === 'csvDeduct') csvDeduct = t.checked;
  if (t.id === 'csvFile' && t.files?.[0]) {
    const file = t.files[0]; t.value = '';
    if (file.size > 15e6) { toast('Файл больше 15 МБ, выгрузи выписку за меньший период'); return; }
    toast('Читаю выписку…');
    readStatement(file).then(rows => {
      if (!rows.length) { toast('Не нашёл в файле операций с датой и суммой'); return; }
      csvRows = rows; renderProfile(); toast(`Нашёл ${rows.length} ${plural(rows.length, 'операцию', 'операции', 'операций')}, проверь список`);
    }).catch(err => toast(err && err.message === 'lib' ? 'Не удалось загрузить модуль для этого формата. Попробуй CSV' : 'Не получилось прочитать файл. Попробуй другой формат выгрузки'));
  }
  if (t.id === 'importFile' && t.files?.[0]) {
    if (t.files[0].size > 2e6) { toast('Файл слишком большой для копии этого приложения'); return; }
    const r = new FileReader();
    r.onload = () => {
      try { const data = JSON.parse(r.result); if (!data || typeof data !== 'object' || !Array.isArray(data.bills)) throw 0;
        S = migrate(Object.assign(data, { onboarded: true })); shownCells = null; commit('Данные загружены из файла');
      } catch (err) { toast('Это не похоже на копию из этого приложения'); }
    };
    r.readAsText(t.files[0]);
  }
});

/* ---------- boot ---------- */
let rateFail = false;
function rateInfo() {
  return (S.ratesAt ? `Курсы от ${fmtD(parse(S.ratesAt))}${S.ratesAuto ? ', по ЦБ' : ', вписаны вручную'}` : 'Курсы вписаны вручную') + (rateFail ? ' · автообновление здесь недоступно' : '');
}
async function fetchRates(manual) {
  try {
    const r = await fetch('https://www.cbr-xml-daily.ru/daily_json.js', { cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer' });
    const j = await r.json(), u = +j.Valute.USD.Value, e = +j.Valute.EUR.Value;
    if (!(u > 0 && u < 1e5 && e > 0 && e < 1e5)) throw new Error('bad rates');
    S.usdRate = Math.round(u * 100) / 100; S.eurRate = Math.round(e * 100) / 100; S.ratesAt = ymd(today0()); S.ratesAuto = true; rateFail = false;
    if (onb && !(onb.ratesAt && !onb.ratesAuto)) Object.assign(onb, { usdRate: S.usdRate, eurRate: S.eurRate, ratesAt: S.ratesAt, ratesAuto: true });
    commit(manual ? `Курсы обновлены: $ ${S.usdRate}, € ${S.eurRate}` : undefined);
  } catch (err) {
    rateFail = true;
    document.querySelectorAll('[data-rateinfo]').forEach(el => el.textContent = rateInfo());
    if (manual) toast('Не получилось загрузить курсы. Впиши курс вручную');
  }
}
setTimeout(() => { if (S.onboarded && !onb && S.ratesAt !== ymd(today0()) && S.entries.some(e => e.cur !== 'RUB')) fetchRates(false); }, 4000);
let downloads = null;
async function exportData() {
  const json = JSON.stringify(S, null, 2), name = `do-zarplaty-${ymd(today0())}.json`;
  if (downloads) { try { await downloads.save({ filename: name, data: json }); toast('Копия сохранена'); } catch (e) { toast('Сохранение отменено'); } return; }
  try { await navigator.clipboard.writeText(json); toast('Скачивание недоступно, копия скопирована в буфер'); }
  catch (e) { toast('Скачивание здесь недоступно'); }
}
view = (() => { const h = location.hash.slice(1); if (h === 'income') return 'money'; return TABS.some(t => t[0] === h) ? h : 'home'; })();
let cached = null;
try { const ls = LSKEY && localStorage.getItem(LSKEY); if (ls) cached = JSON.parse(ls); } catch (e) {}
if (cached) { S = migrate(cached); mode = 'local'; }
render();

function goLocal(text) {
  mode = 'local'; setSync('warn', text);
  if (!S.onboarded && !onb) startOnb(); else { render(); stampDay(); }
}
async function tgBoot() {
  try { TG.ready(); TG.expand(); } catch (e) {}
  const v = x => { try { return TG.isVersionAtLeast(x); } catch (e) { return false; } };
  const hex = c => { const m = String(c).match(/\d+/g); return m && m.length >= 3 ? '#' + m.slice(0, 3).map(n => (+n).toString(16).padStart(2, '0')).join('') : null; };
  // Paint Telegram's own bars in the app's background so no strip of another colour remains.
  const colors = () => { try {
    const bg = hex(getComputedStyle(document.body).backgroundColor), bar = hex(getComputedStyle($('tabbar')).backgroundColor) || bg;
    if (!bg) return;
    try { if (v('6.1')) { TG.setHeaderColor(bg); TG.setBackgroundColor(bg); } } catch (e) {}
    try { if (v('7.10')) TG.setBottomBarColor(window.matchMedia('(max-width:760px)').matches ? bar : bg); } catch (e) {}
  } catch (e) {} };
  const theme = () => { try { document.documentElement.setAttribute('data-theme', TG.colorScheme === 'light' ? 'light' : 'dark'); } catch (e) {} colors(); };
  theme(); try { TG.onEvent('themeChanged', theme); } catch (e) {}
  // Telegram reports its own insets (status bar, close/menu buttons); the page keeps clear of them.
  const insets = () => { try {
    const s = TG.safeAreaInset || {}, c = TG.contentSafeAreaInset || {}, r = document.documentElement.style;
    r.setProperty('--sat', ((+s.top || 0) + (+c.top || 0)) + 'px');
    r.setProperty('--sab', ((+s.bottom || 0) + (+c.bottom || 0)) + 'px');
  } catch (e) {} };
  for (const ev of ['safeAreaChanged', 'contentSafeAreaChanged', 'fullscreenChanged', 'viewportChanged']) try { TG.onEvent(ev, insets); } catch (e) {}
  if (/^(android|ios)$/.test(TG.platform || '') && v('8.0')) {
    try { TG.requestFullscreen(); } catch (e) {}
    try { if (v('7.7')) TG.disableVerticalSwipes(); } catch (e) {}
  }
  insets();
  const u = (TG.initDataUnsafe && TG.initDataUnsafe.user) || {};
  me = { name: cleanName([u.first_name, u.last_name].filter(Boolean).join(' ')), avatarUrl: safeImg(u.photo_url),
    handle: /^[A-Za-z0-9_]{3,32}$/.test(String(u.username || '')) ? String(u.username) : '' };
  let ok = false; try { ok = !!TG.CloudStorage && (!TG.isVersionAtLeast || TG.isVersionAtLeast('6.9')); } catch (e) {}
  if (!ok) { goLocal('Сохраняется только на этом устройстве'); return; }
  try {
    const raw = await Promise.race([tgLoad(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000))]);
    tgCloud = true; mode = 'tg';
    if (raw) { S = migrate(raw); lastJson = canon(S); lsSave(lastJson); }
    else if (S.onboarded) { dirty = true; flush(); }          // first run in Telegram: move this device's data up
    setSync('ok', 'Всё сохранено');
    if (!S.onboarded && !onb) startOnb(); else { render(); stampDay(); }
  } catch (e) {
    // Cloud copy unreadable (interrupted save or no network): keep working from this device and rewrite it on the next save.
    tgCloud = true; mode = 'tg'; tgParts = [];
    setSync('warn', 'Облако не ответило, показываю данные с этого устройства');
    if (!S.onboarded && !onb) startOnb(); else { render(); stampDay(); }
  }
}
(async () => {
  if (TG) { await tgBoot(); return; }
  let db = null, user = null;
  if (user) { try { const m = await user.me(); me = { name: cleanName(m.name), avatarUrl: safeImg(m.avatarUrl), handle: '' }; } catch (e) {} }
  const id = user ? await user.id().catch(() => null) : null;
  if (!db || !id) { goLocal('Сохраняется только на этом устройстве'); return; }
  dbRef = db.doc(`data/users/${id}/budget`);
  let first = true;
  const timer = setTimeout(() => { if (first) goLocal('Облако пока не отвечает, работаю с этого устройства'); }, 10000);
  dbRef.onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites || saving || dirty) return;
    if (snap.metadata.fromCache && !snap.exists) return;
    if (!snap.metadata.fromCache) { clearTimeout(timer); setSync('ok', 'Всё сохранено'); }
    mode = 'cloud';
    if (snap.exists) {
      const json = canon(snap.data());
      if (json !== lastJson || first) {
        const raw = JSON.parse(json), needsMigrate = !raw.v || raw.v < 2;
        S = migrate(raw); lastJson = json; lsSave(json);
        if (!S.onboarded && !onb) startOnb(); else { render(); if (needsMigrate) commit(); }
        if (first) stampDay();
      }
    } else if (first) {
      if (S.onboarded) { dirty = true; flush(); render(); stampDay(); }
      else startOnb();
    }
    first = false;
  }, err => { clearTimeout(timer); dbRef = null; goLocal('Нет доступа к облаку, сохраняю на этом устройстве'); });
})();
</script>
